<!doctype html>
<!-- Probe for the DOM half of the markdown-anchor fix: the logic is covered by node --test, but paint
     order and measured rectangles need a layout engine. This page loads the real desktop/plugin.js
     (specifiers rewritten to stubs, the way the Desktop runtime loader does it), uses the plugin's own
     CSS and its own locateQuote/blockMarkerTops, then reports what the browser actually laid out. -->
<html>
<head>
<meta charset="utf-8">
<title>redline anchor probe</title>
<style>
  :root{--ui-accent:#4f9cf9;--ui-purple:#b06bf9;--ui-orange:#f59e5b;--ui-red:#f26d6d;
        --ui-bg-elevated:#1b1d22;--ui-stroke-secondary:#3a3f47;--ui-stroke-tertiary:#2c3037;
        --ui-text-primary:#e6e8ec;--ui-text-secondary:#b9bec7;--ui-text-tertiary:#8b919b;
        --ui-text-quaternary:#6b717b;--ui-font-mono:ui-monospace,monospace}
  body{margin:0;padding:24px;background:#14161a;color:var(--ui-text-primary);font:14px/1.5 system-ui}
  #result{position:fixed;right:0;bottom:0;max-height:45%;overflow:auto;width:46%;
          background:#0d0f12;border-top:1px solid #3a3f47;margin:0;padding:10px;font-size:11px}
</style>
</head>
<body>
<div class="rl-root" id="root">
  <div class="rl-main">
    <div class="rl-doc" id="doc"></div>
  </div>
</div>
<pre id="result">measuring…</pre>
<script>
window.__errors = []
window.addEventListener('error', (event) =>
  window.__errors.push(`${event.message} @ ${event.filename || '?'}:${event.lineno || 0}`))
window.addEventListener('unhandledrejection', (event) =>
  window.__errors.push(`rejection: ${String((event.reason && (event.reason.stack || event.reason.message)) || event.reason)}`))
</script>
<script type="module">
const report = (text) => {
  document.getElementById('result').textContent = text
}
try {
const KINDS = {
  comment: { short: '◆', line: '--rl-comment', soft: '--rl-comment-soft' },
  question: { short: '◇', line: '--rl-question', soft: '--rl-question-soft' },
  change: { short: '✎', line: '--rl-change', soft: '--rl-change-soft' },
}

// Mirrors the app's Markdown output closely enough: one paragraph per [data-rl-block], with inline
// markup inside the annotated span in the last case.
const BLOCKS = [
  '<p>The project remains within scope and the milestones are on track.</p>',
  '<p>Review meetings should allow <strong>sufficient time</strong> for a meaningful discussion of project progress and next steps.</p>',
  '<p>Financial forecast: spend is 12% under forecast for the period, driven by later recruitment.</p>',
]
const ANNOTATIONS = [
  { id: 'a1', kind: 'comment', block: 1, quote: 'sufficient time for a meaningful discussion' },
  { id: 'a2', kind: 'question', block: 1, quote: 'project progress and next steps' },
  { id: 'a3', kind: 'change', block: 1, quote: 'sufficient time for a meaningful discussion' },
  { id: 'a4', kind: 'comment', block: 2, quote: '12% under forecast' },
  { id: 'a5', kind: 'comment', block: 0, quote: 'within scope **and** the milestones' },
  { id: 'a6', kind: 'comment', block: 2, quote: 'driven by later recruitment', status: 'resolved',
    action: 'Softened the forecast note and moved the recruitment detail into the risk register.' },
]

const STUBS = {
  '@hermes/plugin-sdk': `export const STATUSBAR_AREAS={right:'r'};export const TRANSCRIPT_DIRECTIVE_AREA='d';
export const Badge=()=>{};export const Button=()=>{};export const Codicon=()=>{};export const Input=()=>{};
export const MessageTextContent=()=>{};export const Textarea=()=>{};export const atom=(i)=>({get:()=>i,set(){}});
export const queryClient={setQueryData(){}};export const useValue=()=>0;export const useQuery=()=>({});
export const host={composer:{submit:()=>true},state:{focusedSessionId:{get:()=>''}},notify(){},notifyError(){},openWorkspace(){}};`,
  react: `export const useState=(i)=>[i,()=>{}];export const useEffect=()=>{};export const useRef=()=>({current:null});`,
  'react/jsx-runtime': `export const jsx=(t,p,k)=>({type:t,props:p,key:k});export const jsxs=(t,p,k)=>({type:t,props:p,key:k});`,
}

const blob = (source) => URL.createObjectURL(new Blob([source], { type: 'text/javascript' }))
const stub_urls = Object.fromEntries(Object.entries(STUBS).map(([spec, source]) => [spec, blob(source)]))

const response = await fetch('../../desktop/plugin.js')
if (!response.ok) throw new Error(`plugin.js fetch failed: ${response.status}`)
const source = await response.text()
const rewritten = source.replace(/\bfrom\s*(['"])([^'"]+)\1/g, (whole, quote, spec) =>
  stub_urls[spec] ? `from ${quote}${stub_urls[spec]}${quote}` : whole)
const plugin = await import(blob(rewritten))

const css = source.match(/const CSS = `([\s\S]*?)`\n/)[1]
const style = document.createElement('style')
style.textContent = css
document.head.appendChild(style)

const kindVars = () => {
  const out = {}
  for (const [kind, spec] of Object.entries(KINDS)) {
    out[kind] = { line: `var(${spec.line})`, soft: `var(${spec.soft})` }
  }
  return out
}
const VARS = kindVars()

function textNodesOf(el, out = []) {
  el.childNodes.forEach((node) => {
    if (node.nodeType === 3) out.push(node)
    else if (node.nodeType === 1 && !node.classList.contains('rl-hl') && !node.classList.contains('rl-marker')) textNodesOf(node, out)
  })
  return out
}

function rangeIn(el, span) {
  const nodes = textNodesOf(el)
  const range = document.createRange()
  let at = 0
  let started = false
  for (const node of nodes) {
    const length = node.nodeValue.length
    if (!started && at + length > span.start) { range.setStart(node, span.start - at); started = true }
    if (started && at + length >= span.end) { range.setEnd(node, span.end - at); return range }
    at += length
  }
  return null
}

const doc = document.getElementById('doc')
BLOCKS.forEach((html, index) => {
  const block = document.createElement('div')
  block.dataset.rlBlock = String(index)
  block.className = 'rl-block'
  const wash = document.createElement('div')
  wash.className = 'rl-hl'
  block.appendChild(wash)
  const body = document.createElement('div')
  body.innerHTML = html
  block.appendChild(body)
  doc.appendChild(block)
})

const rows = []
const marks = {}
for (const a of ANNOTATIONS) {
  const block = doc.querySelector(`[data-rl-block="${a.block}"]`)
  const text = textNodesOf(block).map((node) => node.nodeValue).join('')
  const span = plugin.locateQuote(text, a.quote)
  const row = { id: a.id, block: a.block, located: !!span, quote: a.quote }
  if (span) {
    const range = rangeIn(block, span)
    const blockRect = block.getBoundingClientRect()
    const boxes = [...range.getClientRects()]
      .filter((rect) => rect.width > 0 && rect.height > 0)
      .map((rect) => ({ left: rect.left - blockRect.left, top: rect.top - blockRect.top, width: rect.width, height: rect.height }))
    row.covers = text.slice(span.start, span.end)
    row.boxes = boxes.length
    row.firstTop = boxes.length ? Number(boxes[0].top.toFixed(2)) : null
    const wash = block.querySelector('.rl-hl')
    for (const box of plugin.washBoxes(a, { boxes })) {
      const bar = document.createElement('i')
      bar.style.cssText = `left:${box.left}px;top:${box.top}px;width:${box.width}px;height:${box.height}px;--rl-line:${VARS[a.kind].line};--rl-soft:${VARS[a.kind].soft}`
      wash.appendChild(bar)
    }
    row.painted = plugin.washBoxes(a, { boxes }).length
    marks[a.id] = { top: boxes[0].top - 1 }
    row.top = Number((boxes[0].top - 1).toFixed(2))
  } else {
    row.top = 2
  }
  rows.push(row)
}

for (let index = 0; index < BLOCKS.length; index += 1) {
  const block = doc.querySelector(`[data-rl-block="${index}"]`)
  const blockRows = rows.filter((row) => row.block === index)
  const tops = plugin.blockMarkerTops(blockRows, marks, 22)
  tops.forEach((marker) => {
    const a = ANNOTATIONS.find((x) => x.id === marker.id)
    const button = document.createElement('button')
    button.type = 'button'
    button.className = 'rl-marker'
    button.title = a.quote
    button.textContent = plugin.markerGlyph(a)
    button.dataset.id = marker.id
    button.style.cssText = `top:${marker.top}px;--rl-line:${VARS[a.kind].line};--rl-soft:${VARS[a.kind].soft}`
    block.appendChild(button)
    marker.markerTop = Number(marker.top.toFixed(2))
  })
  rows.filter((row) => row.block === index).forEach((row) => {
    row.markerTop = tops.find((marker) => marker.id === row.id).markerTop
    row.aligned = row.located ? Math.abs(row.markerTop - row.top) < 1 : null
  })
}

// Capture: the live selection measured in the DOM. This is the path that makes the wash match what
// was highlighted, instead of slicing the Markdown source (markup, truncation, drift).
const blockOne = doc.querySelector('[data-rl-block="1"]')
const blockOneNodes = textNodesOf(blockOne)
const blockOneText = blockOneNodes.map((node) => node.nodeValue).join('')
const strongNode = blockOneNodes.find((node) => node.nodeValue.includes('sufficient time'))
const tailNode = blockOneNodes[blockOneNodes.length - 1]
const selection = window.getSelection()

const capture = (startNode, startOffset, endNode, endOffset) => {
  selection.setBaseAndExtent(startNode, startOffset, endNode, endOffset)
  const span = plugin.selectionSpan(blockOne, selection.getRangeAt(0))
  return span ? blockOneText.slice(span.start, span.end) : null
}

const selections = {
  inside_one_node: capture(blockOneNodes[0], 5, blockOneNodes[0], 20),
  across_inline_markup: capture(
    blockOneNodes[0], blockOneNodes[0].nodeValue.indexOf('allow'),
    strongNode, strongNode.nodeValue.indexOf('time') + 4,
  ),
  running_past_the_block: capture(
    tailNode, tailNode.nodeValue.indexOf('next steps'),
    doc.querySelector('[data-rl-block="2"]'), 0,
  ),
}
selections.expected = {
  inside_one_node: blockOneText.slice(5, 20),
  across_inline_markup: blockOneText.slice(blockOneText.indexOf('allow'), blockOneText.indexOf('sufficient time') + 'sufficient time'.length),
  running_past_the_block: blockOneText.slice(blockOneText.indexOf('next steps')),
}
selection.removeAllRanges()

// Facts the browser can answer: are the wash bars behind the glyphs (paint order), and does a marker
// line up with the row it belongs to?
const probe = doc.querySelector('[data-rl-block="1"] .rl-hl i')
const washRect = probe.getBoundingClientRect()
const probePoint = { x: washRect.left + 3, y: washRect.top + washRect.height / 2 }
const hit = document.elementFromPoint(probePoint.x, probePoint.y)

report(JSON.stringify({
  rows,
  selections,
  markers: [...doc.querySelectorAll('.rl-marker')].map((button) => ({
    id: button.dataset.id,
    glyph: button.textContent,
    top: Number.parseFloat(button.style.top),
  })),
  wash_bars: [...doc.querySelectorAll('.rl-hl i')].length,
  paint: {
    wash_z: getComputedStyle(probe).zIndex,
    wash_pointer_events: getComputedStyle(probe).pointerEvents,
    block_isolation: getComputedStyle(doc.querySelector('[data-rl-block="1"]')).isolation,
    topmost_element_over_the_wash: hit ? `${hit.tagName.toLowerCase()}.${hit.className || ''}` : null,
  },
}, null, 1))
window.__probe = 'done'
} catch (error) {
  report(`ERR ${error && error.message}\n${error && error.stack}`)
  window.__probe = 'error'
}
</script>
</body>
</html>
